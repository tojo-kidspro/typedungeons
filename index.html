<style>
:root{
  --bg:#000000;--fg:#ffffff;--dim:#8a8a8a;--faint:#333333;--btn:#ff8a1f;--sel:#ffe600;
  --hp:#ffe600;--hpbg:#c8102e;--ehp:#22e05a;--shield:#3fb6ff;--keyhi:#ffe600;
  --mf:grayscale(1) brightness(1.35) contrast(1.2);
  --r0:#ffffff;--r1:#3dff6e;--r2:#3fa9ff;--r3:#c77dff;--r4:#ffd43b;--r5:#ff3b3b;--r6:#ffeeb0;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{height:100%;background:var(--bg);color:var(--fg);font-family:'DotGothic16',ui-monospace,'Osaka-Mono','MS Gothic',monospace;overflow:hidden;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:none;background:none;letter-spacing:inherit}
button:focus-visible{outline:2px dashed var(--sel);outline-offset:3px}
#app{height:100%;max-width:1400px;margin:0 auto;position:relative}
.screen{display:none;height:100%}
.screen.active{display:flex}
.muted,.small{color:var(--dim)}
.small{font-size:12px}
.box{border:4px solid var(--fg)}

/* ---------- home ---------- */
#home{flex-direction:column}
.hscroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 16px}
.hnote{text-align:center}
.cmd{display:flex;gap:10px;padding:10px 12px 12px;border-top:4px solid var(--fg)}
.cmd button{flex:1;height:52px;border:4px solid var(--btn);color:var(--btn);font-size:18px;letter-spacing:.1em}
.cmd button.main{flex:2}
.cmd button:hover,.cmd button.on{border-color:var(--sel);color:var(--sel)}
.cmd button.on::before,.cmd button.main:hover::before{content:"▶ "}
.fhead{display:flex;justify-content:space-between;align-items:baseline}
.fgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.fc{aspect-ratio:1;border:2px solid var(--faint);font-size:11px;color:var(--faint);display:grid;place-items:center}
.fc.clr{border-color:var(--fg);color:var(--fg)}
.fc.next{border-color:var(--btn);color:var(--btn);animation:blink 1s steps(2) infinite}
.fc.sel{background:var(--sel);border-color:var(--sel);color:#000;animation:none}
.fc:disabled{cursor:default}
.finfo{margin-top:12px;font-size:14px;line-height:1.7}
.statgrid{margin-top:12px;padding-top:12px;border-top:2px solid var(--faint)}
@keyframes blink{50%{opacity:.3}}
.hero{text-align:center;padding:18px 0 6px}
.logo{font-size:clamp(42px,11vw,76px);line-height:1;letter-spacing:.14em;color:var(--fg)}
.sub{margin-top:12px;font-size:14px;color:var(--dim)}
.card{width:100%;max-width:520px;border:4px solid var(--fg);padding:14px 16px}
.rankrow{display:flex;align-items:baseline;gap:12px}
.rankrow .rk{font-size:36px;line-height:1;color:var(--sel)}
.xpbar{height:12px;background:var(--faint);margin:10px 0 6px}
.xpbar i{display:block;height:100%;background:var(--fg)}
.slotdots{display:flex;gap:6px;margin-top:10px}
.slotdots span{width:24px;height:24px;border:2px solid var(--dim);display:grid;place-items:center;font-size:11px;color:var(--dim)}
.slotdots span.on{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.floorsel{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 14px}
.floorsel button{width:46px;height:40px;border:3px solid var(--btn);color:var(--btn)}
.floorsel button:hover{border-color:var(--sel);color:var(--sel)}
.floorsel .fv{min-width:110px;text-align:center;font-size:30px}
.big{position:relative;width:100%;max-width:520px;height:54px;border:4px solid var(--btn);color:var(--btn);font-size:20px;letter-spacing:.2em}
.big:hover,.big:focus-visible{border-color:var(--sel);color:var(--sel);outline:none}
.big:hover::before,.big:focus-visible::before{content:"▶";position:absolute;left:16px}
.big:active{transform:translateY(2px)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;font-size:12px}
.statgrid div{display:flex;flex-direction:column;gap:2px}
.statgrid span{color:var(--dim)}
.statgrid b{font-weight:400;font-size:19px}

/* ---------- battle ---------- */
#battle{flex-direction:column}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.bhud{display:flex;align-items:center;gap:12px;padding:10px 12px 8px;font-size:14px}
.bhud .fl{font-size:16px}
.retreat{padding:4px 10px;border:3px solid var(--btn);color:var(--btn);font-size:13px}
.retreat:hover{border-color:var(--sel);color:var(--sel)}
.bhud .combo{margin-left:auto;display:flex;align-items:baseline;gap:10px}
.combo .cn{font-size:14px;color:var(--dim)}
.combo .cm{font-size:22px;color:var(--dim);padding:0 8px;border:3px solid var(--faint)}
.combo.hot .cm{color:var(--sel);border-color:var(--sel)}
.combo.up .cm{animation:pulse .35s steps(3)}
.word{margin:0 12px;padding:10px 12px 12px;border:4px solid var(--fg);text-align:center;min-height:104px}
.word.shake{animation:shake .25s steps(4)}
.wdisp{font-size:13px;color:var(--dim);min-height:18px}
.wkana{font-size:clamp(24px,6.6vw,36px);line-height:1.3;word-break:break-all}
.wkana .d{color:var(--faint)}
.wkana .c{color:var(--sel)}

  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%) no-repeat;background-size:300% 100%;animation:shine 2.8s ease-in-out infinite;pointer-events:none}

@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}

function tokenize(kana){
  const ch=[...kana],raw=[];
  for(let i=0;i<ch.length;i++){
    const nx=ch[i+1];
    if(nx&&SMALL.includes(nx)&&K[ch[i]]&&ch[i]!=='っ'){
      const two=ch[i]+nx,split=[];
      K[ch[i]].forEach(a=>K[nx].forEach(b=>split.push(a+b)));
      raw.push({k:two,c:[...new Set((K[two]||[]).concat(split))]});i++;continue;
    }
    raw.push({k:ch[i],c:(K[ch[i]]||[ch[i]]).slice()});
  }
  const out=[];
  for(let i=0;i<raw.length;i++){
    const t=raw[i],n=raw[i+1];
    if(t.k==='っ'&&n&&n.k!=='っ'&&n.k!=='ん'){
      const c=[];
      n.c.forEach(x=>{if(!'aiueon-'.includes(x[0])){c.push(x[0]+x);if(x.startsWith('ch'))c.push('t'+x);}});
      ['xtu','ltu','xtsu','ltsu'].forEach(p=>n.c.forEach(x=>c.push(p+x)));
      out.push({k:'っ'+n.k,c:[...new Set(c)]});i++;continue;
    }
    if(t.k==='ん'){
      const c=['nn','xn'];
      if(n&&n.c.every(x=>!'aiueony'.includes(x[0])))c.unshift('n');
      out.push({k:'ん',c});continue;
    }
    out.push(t);
  }
  out.forEach(t=>t.c.sort((a,b)=>a.length-b.length));
  return out;
}

  else if(a==='enh'){
    const t=byId(A.target),mats=[...A.mats].map(byId).filter(Boolean),g=mats.reduce((s,m)=>s+matExp(m),0),from=t.lv,cap=RAR[t.r].cap;
    t.xp+=g;t.tx+=g;while(t.lv<cap&&t.xp>=needXP(t,t.lv)){t.xp-=needXP(t,t.lv);t.lv++}if(t.lv>=cap)t.xp=0;
    S.inv=S.inv.filter(w=>!A.mats.has(w.id));A.mats.clear();save();se('enhance',t.lv-from);toast(`強化しました　Lv${from} → ${t.lv}`);
  }else if(a==='reset'){A.target=null;A.mats.clear();A.synMat=null;A.evoMat=null;A.pick.clear()}
  else if(a==='unmat'){A.synMat=null;A.pick.clear()}
  else if(a==='evo'){
    const t=byId(A.target),m=byId(A.evoMat),nx=evoNext(t);if(!t||!m||!nx||t.lv<RAR[t.r].cap||!evoMatOk(t,m))return;
    const picks=[...A.pick].map(k=>({...(k[0]==='b'?t.aff:m.aff)[+k.slice(1)]}));if(picks.length!==synNeed(t,m,RAR[6].slots))return;
    modal(`<h2>デコードしますか？</h2><p>「${esc(t.name)}」をデコードして、真の力を引き出します。</p><p>素材の「${esc(m.name)}」（Lv${m.lv}）はなくなります。</p><p class="small">付ける追加能力：${picks.map(a=>AFFD[a.k].n).join('・')||'なし'}</p>`,[{t:'やめる'},{t:'デコードする',pri:true,fn:()=>{
      if(!byId(t.id)||!byId(m.id))return;t.r=nx.r;t.gw=0;t.god=1;t.name=nx.name;t.aff=picks;t.xp=0;S.inv=S.inv.filter(w=>w.id!==m.id);A.evoMat=null;A.pick.clear();S.rec.dex[dexKey(t)]=1;save();se('evolve');renderArmory();
      setTimeout(()=>se('drop',5),900);setTimeout(()=>modal(`<h2 class="godt">デコード完了</h2><div class="drops">${dropHTML(t)}</div><p>真の名が解き放たれた。</p>`,[{t:'閉じる',pri:true}]),30)}}]);
  }
  else if(a==='syn'){
    const t=byId(A.target),m=byId(A.synMat);
    t.aff=[...A.pick].map(k=>({...(k[0]==='b'?t.aff:m.aff)[+k.slice(1)]}));
    S.inv=S.inv.filter(w=>w.id!==m.id);A.synMat=null;A.pick.clear();save();se('synth');toast('合成しました');
  }
  renderArmory();
};

/* hover preview (mouse) */
const IW=$('invwrap');
function armTip(w){const t=byId(A.target);
  if(A.tab==='equip'){const cur=byId(S.eq[A.slot]);return paneHTML(w,cur&&cur.id!==w.id?`カーソル中の武器（スロット${A.slot+1}の装備と比較）`:'カーソル中の武器',w.id===(cur&&cur.id)?undefined:(cur||null))}
  if(A.tab==='enh')return paneHTML(w,'カーソル中の武器',undefined,(t&&w.id!==t.id)?`<div class="prev">素材にすると +${matExp(w)}EXP</div>`:'');
  const cv=t&&w.r===t.r&&w.id!==t.id;return paneHTML(cv?Object.assign({},w,{lv:t.lv}):w,cv?`カーソル中の武器（追加能力はベースのLv${t.lv}に換算）`:'カーソル中の武器')}
function armTipOn(e,w){if(w&&$('ctx').classList.contains('on'))w=null;if(!w){TIP.classList.remove('on');TIP._id=null;return}const key=[A.tab,w.id,A.slot,A.target].join(':');if(TIP._id!==key){TIP._id=key;TIP.innerHTML=armTip(w)}TIP.classList.add('on');tipPos(e.clientX,e.clientY)}
function armTipOff(){TIP.classList.remove('on');TIP._id=null}
IW.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse'||P)return;const c=e.target.closest('.wc');armTipOn(e,c&&byId(+c.dataset.id))});
IW.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!P&&TIP.classList.contains('on'))tipPos(e.clientX,e.clientY)});
[['slots','data-slot',el=>byId(S.eq[+el.dataset.slot])],['matrow','data-mid',el=>byId(+el.dataset.mid)]].forEach(([id,at,get])=>{const box=$(id);
  box.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('['+at+']');armTipOn(e,el&&get(el))});
  box.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&TIP.classList.contains('on'))tipPos(e.clientX,e.clientY)});
  box.addEventListener('pointerleave',armTipOff)});
IW.addEventListener('pointerleave',armTipOff);

/* drag to scroll / long-press drag to equip */
let P=null,ghost=null,inertia=0;
IW.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  cancelAnimationFrame(inertia);armTipOff();
  const card=e.target.closest('.wc');
  P={x:e.clientX,y:e.clientY,st:IW.scrollTop,card,mode:'pend',ly:e.clientY,lt:performance.now(),v:0};
  try{IW.setPointerCapture(e.pointerId)}catch(_){}
  if(card&&A.tab==='equip'){const p=P;P.timer=setTimeout(()=>{if(P===p&&p.mode==='pend')startDrag(p.x,p.y)},320)}
});
IW.addEventListener('pointermove',e=>{
  if(!P)return;const dx=e.clientX-P.x,dy=e.clientY-P.y;
  if(P.mode==='pend'&&Math.hypot(dx,dy)>6){clearTimeout(P.timer);
    if(P.card&&A.tab==='equip'&&Math.abs(dx)>Math.abs(dy)*1.2)startDrag(e.clientX,e.clientY);else P.mode='scroll'}
  if(P.mode==='scroll'){IW.scrollTop=P.st-dy;const now=performance.now(),dt=now-P.lt;if(dt>0){P.v=(e.clientY-P.ly)/dt;P.ly=e.clientY;P.lt=now}}
  else if(P.mode==='drag')moveGhost(e.clientX,e.clientY);
});
function endP(e,cancel){
  if(!P)return;clearTimeout(P.timer);const p=P;P=null;
  if(p.mode==='pend'&&!cancel&&p.card)tapCard(+p.card.dataset.id,e.clientX,e.clientY,e.pointerType);
  else if(p.mode==='scroll'&&performance.now()-p.lt<80){let v=-p.v*16;const step=()=>{if(Math.abs(v)<.5)return;IW.scrollTop+=v;v*=.93;inertia=requestAnimationFrame(step)};step()}
  else if(p.mode==='drag')dropGhost(p,e.clientX,e.clientY,cancel);
}
IW.addEventListener('pointerup',e=>endP(e,false));
IW.addEventListener('pointercancel',e=>endP(e,true));
function startDrag(x,y){
  const w=byId(+P.card.dataset.id);if(!w)return;P.mode='drag';P.wid=w.id;
  ghost=document.createElement('div');ghost.className='ghost';ghost.style.setProperty('--rc',RAR[w.r].c);ghost.innerHTML=wIcon(w);document.body.appendChild(ghost);
  P.card.classList.add('lift');A.sel=w.id;A.hover=null;renderTop();moveGhost(x,y);
}
function slotAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('[data-slot]')}
function moveGhost(x,y){if(!ghost)return;ghost.style.left=x+'px';ghost.style.top=y+'px';
  document.querySelectorAll('.slot.drop').forEach(s=>s.classList.remove('drop'));const s=slotAt(x,y);if(s)s.classList.add('drop')}
function dropGhost(p,x,y,cancel){
  const s=cancel?null:slotAt(x,y);if(ghost){ghost.remove();ghost=null}
  if(s)equipTo(p.wid,+s.dataset.slot);renderArmory();
}

$('accBtn').onclick=()=>showAccount();$('xferBtn').onclick=()=>showTransfer();if(!window.claude)$('accBtn').style.display='none';load();renderHome();renderSnd();renderAcc();AU.want='home';setTimeout(tutAuto,700);

</script>
