<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タイプダンジョンズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--fg:#000000;--dim:#6b6b6b;--faint:#cfcfcf;--btn:#c2410c;--sel:#b45309;
  --hp:#e0b000;--hpbg:#c8102e;--ehp:#16a34a;--shield:#0284c7;--keyhi:#ffd400;
  --mf:grayscale(1) contrast(1.15);
  --r0:#555555;--r1:#15803d;--r2:#1d4ed8;--r3:#7e22ce;--r4:#a16207;--r5:#dc2626;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--fg:#ffffff;--dim:#8a8a8a;--faint:#333333;--btn:#ff8a1f;--sel:#ffe600;
  --hp:#ffe600;--hpbg:#c8102e;--ehp:#22e05a;--shield:#3fb6ff;--keyhi:#ffe600;
  --mf:grayscale(1) brightness(1.35) contrast(1.2);
  --r0:#ffffff;--r1:#3dff6e;--r2:#3fa9ff;--r3:#c77dff;--r4:#ffd43b;--r5:#ff3b3b;
}}
:root[data-theme="dark"]{
  --bg:#000000;--fg:#ffffff;--dim:#8a8a8a;--faint:#333333;--btn:#ff8a1f;--sel:#ffe600;
  --hp:#ffe600;--hpbg:#c8102e;--ehp:#22e05a;--shield:#3fb6ff;--keyhi:#ffe600;
  --mf:grayscale(1) brightness(1.35) contrast(1.2);
  --r0:#ffffff;--r1:#3dff6e;--r2:#3fa9ff;--r3:#c77dff;--r4:#ffd43b;--r5:#ff3b3b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{height:100%;background:var(--bg);color:var(--fg);font-family:'DotGothic16',ui-monospace,'Osaka-Mono','MS Gothic',monospace;overflow:hidden;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:none;background:none;letter-spacing:inherit}
button:focus-visible{outline:2px dashed var(--sel);outline-offset:3px}
#app{height:100%;max-width:1400px;margin:0 auto;position:relative}
.screen{display:none;height:100%}
.screen.active{display:flex}
.muted,.small{color:var(--dim)}
.small{font-size:12px}
.box{border:4px solid var(--fg)}

/* ---------- home ---------- */
#home{flex-direction:column}
.hscroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 16px}
.hnote{text-align:center}
.cmd{display:flex;gap:10px;padding:10px 12px 12px;border-top:4px solid var(--fg)}
.cmd button{flex:1;height:52px;border:4px solid var(--btn);color:var(--btn);font-size:18px;letter-spacing:.1em}
.cmd button.main{flex:2}
.cmd button:hover,.cmd button.on{border-color:var(--sel);color:var(--sel)}
.cmd button.on::before,.cmd button.main:hover::before{content:"▶ "}
.fhead{display:flex;justify-content:space-between;align-items:baseline}
.fgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.fc{aspect-ratio:1;border:2px solid var(--faint);font-size:11px;color:var(--faint);display:grid;place-items:center}
.fc.clr{border-color:var(--fg);color:var(--fg)}
.fc.next{border-color:var(--btn);color:var(--btn);animation:blink 1s steps(2) infinite}
.fc.sel{background:var(--sel);border-color:var(--sel);color:#000;animation:none}
.fc:disabled{cursor:default}
.finfo{margin-top:12px;font-size:14px;line-height:1.7}
.statgrid{margin-top:12px;padding-top:12px;border-top:2px solid var(--faint)}
@keyframes blink{50%{opacity:.3}}
.hero{text-align:center;padding:18px 0 6px}
.logo{font-size:clamp(42px,11vw,76px);line-height:1;letter-spacing:.14em;color:var(--fg)}
.sub{margin-top:12px;font-size:14px;color:var(--dim)}
.card{width:100%;max-width:520px;border:4px solid var(--fg);padding:14px 16px}
.rankrow{display:flex;align-items:baseline;gap:12px}
.rankrow .rk{font-size:36px;line-height:1;color:var(--sel)}
.xpbar{height:12px;background:var(--faint);margin:10px 0 6px}
.xpbar i{display:block;height:100%;background:var(--fg)}
.slotdots{display:flex;gap:6px;margin-top:10px}
.slotdots span{width:24px;height:24px;border:2px solid var(--dim);display:grid;place-items:center;font-size:11px;color:var(--dim)}
.slotdots span.on{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.floorsel{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 14px}
.floorsel button{width:46px;height:40px;border:3px solid var(--btn);color:var(--btn)}
.floorsel button:hover{border-color:var(--sel);color:var(--sel)}
.floorsel .fv{min-width:110px;text-align:center;font-size:30px}
.big{position:relative;width:100%;max-width:520px;height:54px;border:4px solid var(--btn);color:var(--btn);font-size:20px;letter-spacing:.2em}
.big:hover,.big:focus-visible{border-color:var(--sel);color:var(--sel);outline:none}
.big:hover::before,.big:focus-visible::before{content:"▶";position:absolute;left:16px}
.big:active{transform:translateY(2px)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;font-size:12px}
.statgrid div{display:flex;flex-direction:column;gap:2px}
.statgrid span{color:var(--dim)}
.statgrid b{font-weight:400;font-size:19px}

/* ---------- battle ---------- */
#battle{flex-direction:column}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.bhud{display:flex;align-items:center;gap:12px;padding:10px 12px 8px;font-size:14px}
.bhud .fl{font-size:16px}
.retreat{padding:4px 10px;border:3px solid var(--btn);color:var(--btn);font-size:13px}
.retreat:hover{border-color:var(--sel);color:var(--sel)}
.bhud .combo{margin-left:auto;display:flex;align-items:baseline;gap:10px}
.combo .cn{font-size:14px;color:var(--dim)}
.combo .cm{font-size:22px;color:var(--dim);padding:0 8px;border:3px solid var(--faint)}
.combo.hot .cm{color:var(--sel);border-color:var(--sel)}
.combo.up .cm{animation:pulse .35s steps(3)}
.word{margin:0 12px;padding:10px 12px 12px;border:4px solid var(--fg);text-align:center;min-height:104px}
.word.shake{animation:shake .25s steps(4)}
.wdisp{font-size:13px;color:var(--dim);min-height:18px}
.wkana{font-size:clamp(24px,6.6vw,36px);line-height:1.3;word-break:break-all}
.wkana .d{color:var(--faint)}
.wkana .c{color:var(--sel)}
.wroma{font-size:clamp(15px,4vw,20px);letter-spacing:.12em;word-break:break-all;margin-top:4px;color:var(--dim)}
.wroma .d{color:var(--faint)}
.wroma .c{color:var(--fg)}
.enemy-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-bottom:8px}
.ename{font-size:15px}
.ename .bs{color:var(--bg);background:var(--hpbg);padding:0 6px;font-size:12px;margin-right:6px}
.ebar,.etimer{width:min(64%,320px);background:var(--faint)}
.ebar{height:12px}
.ebar i{display:block;height:100%;width:100%;background:var(--ehp)}
.etimer{height:4px}
.etimer i{display:block;height:100%;width:0;background:var(--fg)}
.etimer.stun i{background:var(--shield)}
.enemy{font-size:min(28vw,16vh);line-height:1.1;animation:bob 1.6s steps(2) infinite}
.enemy.boss{font-size:min(38vw,22vh)}
#eg{display:inline-block;filter:var(--mf)}
#eg.enter{animation:enter .35s steps(4)}
#eg.hit{animation:hit .22s steps(3)}
#eg.atk{animation:atk .3s steps(3)}
#eg.die{animation:die .7s steps(6) forwards}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:26px;color:var(--fg);text-shadow:2px 2px 0 var(--bg);animation:rise .9s steps(6) forwards;white-space:nowrap}
.pop.crit{color:var(--sel);font-size:32px}
.pop.skill{font-size:16px;background:var(--bg);border:3px solid var(--fg);padding:3px 10px;text-shadow:none;animation:banner 1.1s steps(5) forwards}
.pop.sdmg{color:var(--shield)}
.pop.pd{color:var(--hpbg)}
.pop.heal{color:var(--ehp)}
.console{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.console.hurt{animation:hurt .3s steps(3)}
.wicons{display:flex;gap:8px;justify-content:center;min-height:50px}
.wi{position:relative;width:50px;height:50px;border:3px solid var(--rc);display:grid;place-items:center;font-size:26px}
.wi.cool{border-color:var(--faint)}
.wi.cool .em{opacity:.18}
.wi .ct{position:absolute;inset:0;display:none;place-items:center;font-size:20px;color:var(--fg)}
.wi.cool .ct{display:grid}
.wi.fire{animation:pulse .4s steps(3)}
.php{display:flex;align-items:center;gap:10px;font-size:14px}
.php .lab{font-size:14px}
.phpbar{flex:0 1 220px;height:20px;background:var(--hpbg);position:relative}
.phpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp)}
.phpbar b{position:absolute;left:0;top:0;bottom:0;background:var(--shield);opacity:.85}
.phptxt{font-size:15px}
.buffs{display:flex;gap:10px;font-size:12px;color:var(--dim);min-height:14px}
.kb{display:flex;flex-direction:column;gap:5px;user-select:none;-webkit-user-select:none}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:0 0 calc((100% - 40px)/11);height:clamp(40px,6.4vh,54px);border:2px solid var(--fg);font-size:18px;display:grid;place-items:center}
.k.hi{background:var(--keyhi);border-color:var(--keyhi);color:#000}
.k.ok{background:var(--fg);color:var(--bg)}
.k.ng{background:var(--hpbg);border-color:var(--hpbg);color:#fff}

/* ---------- armory ---------- */
#armory{flex-direction:column}
.abar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:4px solid var(--fg)}
.back{padding:5px 12px;border:3px solid var(--btn);color:var(--btn)}
.back:hover{border-color:var(--sel);color:var(--sel)}
.atitle{font-size:18px;margin-left:4px}
#aSub{margin-left:auto;text-align:right}
.atop{flex:0 0 50%;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:4px solid var(--fg)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pane{border:3px solid var(--fg);padding:8px 10px;min-width:0;font-size:12px}
.pane .tag{font-size:11px;color:var(--dim);margin-bottom:6px}
.pane .empty{font-size:12px;padding:10px 0}
.ph{display:flex;gap:8px;align-items:center}
.ph .dem{width:42px;height:42px;flex:0 0 42px;font-size:22px}
.ph .dn{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.rows span{color:var(--dim)}
.rows b{font-weight:400;text-align:right}
.rows small{font-size:11px}
.up{color:var(--ehp)}
.down{color:var(--hpbg)}
.psk{margin-top:8px;line-height:1.55}
.psk b{font-weight:400;color:var(--sel)}
.slot{position:relative}
.slot .sn{position:absolute;top:1px;left:3px;font-size:9px;color:var(--dim)}
.slot.drop{background:var(--sel);border-color:var(--sel)}
.abot{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 12px 0}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;font-size:12px}
.tools label{display:flex;align-items:center;gap:4px;color:var(--dim)}
.tools select,.tools button{font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:2px solid var(--fg);padding:3px 6px;border-radius:0}
.rchips{display:flex;gap:3px}
.tools .rchip{border-color:var(--rc);color:var(--rc);opacity:.3;padding:3px 7px}
.tools .rchip.on{opacity:1}
#invHead{margin-left:auto}
.invwrap{touch-action:none;padding-bottom:10px;cursor:grab;user-select:none;-webkit-user-select:none}
.wc{cursor:pointer}
.wc.lift{opacity:.25}
.ghost{position:fixed;z-index:80;pointer-events:none;width:60px;height:60px;border:3px solid var(--rc);background:var(--bg);display:grid;place-items:center;font-size:28px;transform:translate(-50%,-50%) scale(1.15)}
.ctx{position:fixed;z-index:70;background:var(--bg);border:3px solid var(--fg);min-width:190px;display:none;padding:4px 0}
.ctx.on{display:block}
.ctx button{display:block;width:100%;text-align:left;padding:8px 14px;font-size:14px}
.ctx button:hover{color:var(--sel)}
.ctx button:hover::before{content:"▶ "}
.big.go{margin-top:12px}
.card .big{margin-top:12px}
.alert{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:stretch;justify-content:center;gap:0;background:rgba(0,0,0,.7);pointer-events:none}
.alert.on{display:flex;animation:aflash .3s steps(2) 6}
.alert .stripe{height:20px;background:repeating-linear-gradient(-45deg,var(--hpbg) 0 14px,transparent 14px 28px);background-size:40px 20px;animation:slide .5s linear infinite}
.alert .aband{padding:14px 0;text-align:center;border-top:3px solid var(--hpbg);border-bottom:3px solid var(--hpbg);background:rgba(0,0,0,.6)}
.alert .atxt{font-size:clamp(44px,11vw,90px);line-height:1.05;color:#ff2a3a;letter-spacing:.18em;animation:blink .35s steps(2) infinite}
.alert .asub{font-size:15px;color:#fff;letter-spacing:.3em;margin-top:4px}
.alert .aname{font-size:22px;color:#fff;margin-top:8px;animation:enter .4s steps(4)}
.back,.atitle,#pRank{white-space:nowrap}
#aSub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:560px){#aSub{display:none}.atop{flex-basis:46%}.tools label{font-size:0;gap:0}.tools select{max-width:31%}}
@keyframes slide{to{background-position:40px 0}}
@keyframes aflash{0%{background:rgba(200,16,46,.55)}100%{background:rgba(0,0,0,.7)}}
.slots{display:flex;gap:8px;justify-content:center}
.slot{width:56px;height:56px;border:3px dashed var(--dim);display:grid;place-items:center;font-size:26px;color:var(--dim)}
.slot.f{border-style:solid;border-color:var(--rc);filter:none}
.slot.f{font-size:28px}
.slot.lock{font-size:11px;text-align:center;line-height:1.3;border:3px solid var(--faint);color:var(--dim)}
.slot.sel{outline:3px solid var(--sel);outline-offset:3px}
.statsline{font-size:12px;color:var(--dim);text-align:center}
.detail{border:4px solid var(--fg);padding:12px}
.detail .tag{font-size:12px;color:var(--dim);margin-bottom:8px}
.dh{display:flex;gap:12px;align-items:center}
.dem{width:56px;height:56px;flex:0 0 56px;border:3px solid var(--rc);display:grid;place-items:center;font-size:30px}
.dn{font-size:17px;color:var(--rc)}
.dr{font-size:12px;color:var(--dim);margin-top:2px}
.xpb{height:6px;background:var(--faint);margin-top:6px;width:160px;max-width:100%}
.xpb i{display:block;height:100%;background:var(--fg)}
.dstat{margin-top:10px;font-size:13px}
.dstat b{font-weight:400;font-size:16px;margin:0 10px 0 4px}
.daff{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 8px;border:2px solid var(--fg)}
button.chip{border-color:var(--dim);color:var(--dim)}
button.chip.on{border-color:var(--sel);color:var(--sel)}
.chip small{margin-right:4px;opacity:.75}
.dsk{margin-top:10px;font-size:13px;line-height:1.6}
.dsk b{font-weight:400;color:var(--sel)}
.dsk::before{content:"＊ "}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:14px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{padding:7px 14px;border:3px solid var(--btn);color:var(--btn);font-size:14px}
.btn:hover:not(:disabled){border-color:var(--sel);color:var(--sel)}
.btn.pri{border-color:var(--sel);color:var(--sel)}
.btn.pri::before{content:"▶ "}
.btn:disabled{border-color:var(--faint);color:var(--faint);cursor:default}
.btn:disabled::before{content:""}
.prev{width:100%;font-size:13px}
.invhead{font-size:12px;color:var(--dim);margin-bottom:8px}
.invwrap{flex:1;min-height:0;overflow-y:auto}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.wc{position:relative;aspect-ratio:1;border:3px solid var(--rc);display:grid;place-items:center;font-size:26px}
.wc .lv{position:absolute;bottom:1px;right:3px;font-size:10px;color:var(--fg)}
.wc .eb{position:absolute;top:1px;left:2px;font-size:10px;background:var(--fg);color:var(--bg);padding:0 3px}
.wc .ck{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;color:var(--sel);font-size:26px}
.wc.sel{outline:3px solid var(--sel);outline-offset:2px}
.wc.dim{opacity:.22}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);display:none;place-items:center;z-index:50;padding:20px}
.modal.on{display:grid}
.mbox{width:100%;max-width:440px;max-height:85vh;overflow-y:auto;background:var(--bg);border:4px solid var(--fg);padding:20px;animation:enter .25s steps(3)}
.mbox h2{font-weight:400;font-size:26px;margin-bottom:12px;text-align:center}
.mbox p{margin:8px 0;font-size:14px;line-height:1.6}
.mbox p:not(.small)::before{content:"＊ "}
.mbox p.small{text-align:center}
.drops{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.drop{display:flex;align-items:center;gap:10px;padding:6px 10px;border:2px solid var(--rc)}
.drop .e{font-size:22px}
.drop .n{color:var(--rc)}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns .btn{flex:1;padding:10px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.rstats div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid var(--fg);text-align:center}
.rstats b{font-weight:400;font-size:24px;line-height:1.2;color:var(--sel)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--bg);color:var(--fg);border:3px solid var(--fg);padding:8px 16px;font-size:14px;z-index:60;opacity:0;pointer-events:none;max-width:90%}
.toast.on{opacity:1}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes enter{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes hit{0%{transform:translateX(0);opacity:.3}33%{transform:translateX(-8px);opacity:1}66%{transform:translateX(8px)}100%{transform:translateX(0)}}
@keyframes atk{0%{transform:scale(1)}50%{transform:scale(1.2) translateY(10px)}100%{transform:scale(1)}}
@keyframes die{0%{opacity:1}30%{opacity:0}45%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
@keyframes rise{0%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-44px}}
@keyframes banner{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}33%{transform:translateX(-6px)}66%{transform:translateX(6px)}}
@keyframes hurt{0%,66%{background:var(--hpbg)}33%,100%{background:transparent}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.enemy{animation:none}*{animation-duration:.01ms!important}}

/* ---------- PC battle (single column, keyboard at bottom) ---------- */
@media (min-width:720px) and (min-height:560px){
  #battle{width:100%;max-width:980px;margin:0 auto}
  .bhud{padding:12px 4px 10px}
  .word{width:100%;max-width:860px;margin:0 auto;min-height:118px;padding:12px 16px 14px}
  .wkana{font-size:clamp(28px,3.6vh,42px)}
  .wroma{font-size:clamp(17px,2.2vh,24px)}
  .enemy{font-size:min(14vw,19vh)}
  .enemy.boss{font-size:min(19vw,25vh)}
  .ebar{width:min(50%,380px)}
  .console{align-items:center;padding:10px 0 16px;border-top:4px solid var(--fg)}
  .wicons,.php,.buffs,.kb{width:100%;max-width:860px}
  .wi{width:56px;height:56px;font-size:29px}
  .phpbar{flex:0 1 320px}
  .k{height:clamp(44px,6.2vh,58px);font-size:20px}
}
/* ---------- PC / landscape ---------- */
@media (orientation:landscape) and (min-width:720px){
  .atop,.abot{width:100%;max-width:1100px;margin:0 auto}

/* ---------- pixel sprites & rarity fx ---------- */
.fxc{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.wic::before,.wic::after{will-change:transform,opacity}
#eg img{will-change:transform}
img{image-rendering:pixelated}
.logo{font-size:clamp(30px,8.6vw,66px);letter-spacing:.08em}
#eg{filter:none}
#eg img{display:block;width:var(--esz);height:var(--esz);image-rendering:pixelated}
.enemy{--esz:min(40vw,22vh)}
.enemy.boss{--esz:min(58vw,30vh)}
.alert .aname img{width:48px;height:48px;vertical-align:middle;margin-right:10px;image-rendering:pixelated}
.wic{position:relative;display:grid;place-items:center;width:100%;height:100%;isolation:isolate}
.wic>img{width:86%;height:86%;position:relative;z-index:2;image-rendering:pixelated}
.wic>.sh{position:absolute;z-index:3;width:86%;height:86%;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%) no-repeat;background-size:300% 100%;animation:shine 2.8s ease-in-out infinite;pointer-events:none}
.wic::before,.wic::after{content:"";position:absolute;inset:0;pointer-events:none}
.wic::before{z-index:1}
.wic::after{z-index:4}
.wic.r1::before{background:radial-gradient(circle,rgba(61,255,110,.3),transparent 62%)}
.wic.r2::before{background:radial-gradient(circle,rgba(63,169,255,.5),transparent 64%);animation:breathe 2s ease-in-out infinite}
.wic.r3::before{background:radial-gradient(circle,rgba(199,125,255,.7),transparent 64%);animation:breathe 1.4s ease-in-out infinite}
.wic.r4::before{inset:-14%;border-radius:50%;background:repeating-conic-gradient(rgba(255,212,59,.75) 0 7deg,transparent 7deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);animation:spin 6s linear infinite}
.wic.r5::before{inset:-18%;border-radius:50%;background:conic-gradient(#ff2a3a,#300010,#ff8a1a,#300010,#ff2a3a,#300010,#ff2a3a);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 66%);mask:radial-gradient(circle,#000 20%,transparent 66%);animation:spin 1.6s linear infinite,flick .16s steps(2) infinite}
.wic.r3::after,.wic.r4::after{background:radial-gradient(circle at 18% 22%,#fff 0 1.3px,transparent 2.6px),radial-gradient(circle at 82% 30%,#fff 0 1px,transparent 2.2px),
  radial-gradient(circle at 72% 84%,#fff 0 1.4px,transparent 2.8px),radial-gradient(circle at 24% 78%,#fff 0 1px,transparent 2.2px);animation:twinkle 1.3s steps(4) infinite}
.wic.r4::after{animation-duration:.9s}
.wic.r5::after{background:radial-gradient(circle at 20% 90%,#ffb02a 0 1.6px,transparent 2.8px),radial-gradient(circle at 50% 100%,#ff3a3a 0 1.8px,transparent 3px),
  radial-gradient(circle at 80% 92%,#ffd23a 0 1.4px,transparent 2.6px),radial-gradient(circle at 35% 96%,#ff6a2a 0 1.2px,transparent 2.4px);animation:ember 1s linear infinite}
.wic.r4>img,.wic.r5>img{animation:hover 1.6s ease-in-out infinite}
.wic.r5>img{filter:drop-shadow(0 0 3px #ff2a3a)}
.wc .lv,.wc .eb,.wc .ck{z-index:6}
.slot .sn{z-index:6}
.wi .ct{z-index:6}
.wi.cool .wic{opacity:.22;filter:grayscale(1)}
.wi .wic::before,.wi .wic::after{transform-origin:center}
.drop{position:relative}
.drop .e{width:46px;height:46px;flex:0 0 46px;display:block}
.drop.big{animation:getglow .5s steps(2) infinite}
.drop .gt{position:absolute;right:8px;top:4px;color:var(--rc);font-size:14px;animation:blink .3s steps(2) infinite}
.ghost{font-size:0}
.pop.get{font-size:24px;padding:2px 10px;border:3px solid currentColor;background:var(--bg)}
.pop.get.r2{color:var(--r2)}.pop.get.r3{color:var(--r3)}.pop.get.r4{color:var(--r4)}.pop.get.r5{color:var(--r5)}
.pop.sdmg{color:#5ad8ff}
.pop.crit.sdmg{color:#ffe600}
.hits{position:absolute;right:12px;top:42%;z-index:6;text-align:right;color:var(--sel);font-size:16px;line-height:1;pointer-events:none;text-shadow:2px 2px 0 var(--bg)}
.hits b{font-weight:400;font-size:clamp(34px,8vw,58px)}
.hits small{display:block;font-size:14px;color:var(--fg);margin-top:4px}
.hits.bump b{display:inline-block;animation:pulse .12s steps(2)}
.stage.quake{animation:quake .18s steps(3)}
@keyframes shine{0%,45%{background-position:120% 0}100%{background-position:-40% 0}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{50%{opacity:.75}}
@keyframes twinkle{0%{opacity:0;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}100%{opacity:0;transform:scale(.7) rotate(40deg)}}
@keyframes ember{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70%);opacity:0}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes getglow{0%{box-shadow:0 0 0 2px var(--rc)}100%{box-shadow:0 0 14px 3px var(--rc)}}
@keyframes quake{0%{transform:translate(0,0)}33%{transform:translate(-4px,3px)}66%{transform:translate(4px,-2px)}100%{transform:translate(0,0)}}
@media (min-width:720px) and (min-height:560px){.enemy{--esz:min(22vw,23vh)}.enemy.boss{--esz:min(30vw,31vh)}}
@media (prefers-reduced-motion:reduce){.wic::before,.wic::after,.wic>img,.wic>.sh{animation:none!important}}

/* ---------- smooth enemy motion ---------- */
.enemy{animation:ebob 2.6s ease-in-out infinite}
#eg.enter{animation:eenter .55s cubic-bezier(.2,1.4,.4,1)}
#eg.atk{animation:eatk .5s cubic-bezier(.3,0,.3,1)}
#eg.die{animation:edie .75s ease-in forwards}
#eg.hit{animation:none}
@keyframes ebob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(1.025,.975)}}
@keyframes eenter{0%{transform:translateY(24px) scale(.3);opacity:0;filter:brightness(4)}60%{opacity:1}100%{transform:none;opacity:1;filter:none}}
@keyframes eatk{0%{transform:none}30%{transform:translateY(-10px) scale(.94,1.06)}55%{transform:translateY(16px) scale(1.25)}100%{transform:none}}
@keyframes edie{0%{transform:none;opacity:1;filter:brightness(1)}20%{filter:brightness(5)}100%{transform:scale(1.3,.2) translateY(30px);opacity:0;filter:brightness(5) blur(5px)}}
.pop.skill{animation:skb 1.1s ease-out forwards}
@keyframes skb{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%)}}

/* ---------- title logo ---------- */
.hero{position:relative;padding:26px 0 14px;width:100%;max-width:760px;overflow:visible;justify-self:center;margin:0 auto;text-align:center}
.hero .rays{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,200,60,.16) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:spin 28s linear infinite}
.logo{position:relative;font-size:clamp(32px,9.2vw,72px);line-height:1.1;letter-spacing:.04em;white-space:nowrap}
.logo span{display:inline-block;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%),linear-gradient(180deg,#fffbd6 0%,#ffd94a 40%,#ff9a1a 68%,#c2361a 100%);
  background-size:400% 100%,100% 100%;background-repeat:no-repeat;
  filter:drop-shadow(0 2px 0 #5a1a00) drop-shadow(0 4px 0 #2a0a00) drop-shadow(0 0 10px rgba(255,170,40,.55));
  animation:lwave 2.6s ease-in-out infinite,lshine 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.09s),calc(var(--i)*.07s)}
.sub{position:relative;margin-top:10px;font-size:clamp(14px,3.6vw,20px);letter-spacing:.6em;padding-left:.6em;color:#ffd94a;text-shadow:0 0 8px rgba(255,180,40,.7),0 2px 0 #5a1a00;animation:subglow 2.4s ease-in-out infinite}
.spk{position:absolute;inset:0;pointer-events:none}
.spk i{position:absolute;font-style:normal;color:#fff3b0;font-size:calc(14px*var(--s));text-shadow:0 0 6px #ffd23a;animation:twk 2s ease-in-out infinite;opacity:0}
@keyframes lwave{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lshine{0%,55%{background-position:130% 0,0 0}100%{background-position:-40% 0,0 0}}
@keyframes subglow{50%{text-shadow:0 0 16px rgba(255,200,60,1),0 2px 0 #5a1a00}}
@keyframes twk{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

/* ---------- hero status card ---------- */
.hcard{--tc:var(--r0);position:relative}
.hrow{display:flex;gap:16px;align-items:center}

/* ---------- rank emblem (gets fancier with rank) ---------- */
.emb{--tc:var(--fg);position:relative;width:104px;height:104px;flex:0 0 104px;display:grid;place-items:center;isolation:isolate}
.emb.t1{--tc:var(--r1)}.emb.t2{--tc:var(--r2)}.emb.t3{--tc:var(--r3)}.emb.t4{--tc:var(--r4)}.emb.t5{--tc:var(--r5)}.emb.t6{--tc:#ffd23a}
.emb>i{position:absolute;pointer-events:none;display:none;border-radius:50%;font-style:normal}
.emb .r1{display:block;inset:8%;border:2px solid var(--tc)}
.emb .r2{inset:0;border:2px dashed var(--tc);animation:spin 14s linear infinite}
.emb.t1 .r2,.emb.t2 .r2,.emb.t3 .r2{display:block}
.emb.t2 .r1,.emb.t3 .r1{border-width:3px;box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 6px var(--tc)}
.emb .glow{inset:-10%;z-index:-1;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 55%,transparent),transparent 64%);animation:breathe 2.2s ease-in-out infinite}
.emb:is(.t2,.t3,.t4,.t5,.t6) .glow{display:block}
.emb .orb{inset:-6%;animation:spin 3.2s linear infinite}
.emb .orb b{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--tc);box-shadow:0 0 8px 2px var(--tc)}
.emb .orb b:nth-child(1){left:50%;top:0}.emb .orb b:nth-child(2){left:100%;top:50%}.emb .orb b:nth-child(3){left:50%;top:100%}.emb .orb b:nth-child(4){left:0;top:50%}
.emb.t3 .orb b:nth-child(even){display:none}
.emb:is(.t3,.t4,.t5,.t6) .orb{display:block}
.emb:is(.t4,.t5,.t6) .r1{inset:4%;border:none;background:conic-gradient(var(--tc),#fff 10%,var(--tc) 22%,transparent 30%,var(--tc) 50%,#fff 60%,var(--tc) 72%,transparent 80%,var(--tc));
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 64%,#000 72%,transparent 74%);mask:radial-gradient(circle,transparent 62%,#000 64%,#000 72%,transparent 74%);animation:spin 2.6s linear infinite}
.emb:is(.t4,.t5,.t6) .r2{display:block;inset:14%;border:2px solid color-mix(in srgb,var(--tc) 60%,transparent);animation:none}
.emb .rays{inset:-38%;z-index:-2;background:repeating-conic-gradient(color-mix(in srgb,var(--tc) 42%,transparent) 0 6deg,transparent 6deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 28%,transparent 68%);mask:radial-gradient(circle,#000 28%,transparent 68%);animation:spin 10s linear infinite}
.emb:is(.t4,.t5,.t6) .rays{display:block}
.emb .flame{inset:-20%;z-index:-1;background:conic-gradient(var(--tc),#ff8a1a,transparent 18%,var(--tc) 33%,#ffd23a,transparent 52%,var(--tc) 66%,#ff8a1a,transparent 85%,var(--tc));
  -webkit-mask:radial-gradient(circle,transparent 40%,#000 50%,transparent 70%);mask:radial-gradient(circle,transparent 40%,#000 50%,transparent 70%);filter:blur(2px);animation:spin 1.8s linear infinite,flick .14s steps(2) infinite}
.emb:is(.t5,.t6) .flame{display:block}
.emb .embr{inset:-10%;border-radius:0;background:radial-gradient(circle at 20% 90%,#ffb02a 0 2px,transparent 3px),radial-gradient(circle at 50% 100%,var(--tc) 0 2px,transparent 3.2px),
  radial-gradient(circle at 80% 92%,#ffd23a 0 1.6px,transparent 2.8px),radial-gradient(circle at 35% 96%,#ff6a2a 0 1.4px,transparent 2.6px),radial-gradient(circle at 65% 98%,#fff 0 1.2px,transparent 2.4px);animation:ember 1.2s linear infinite}
.emb:is(.t5,.t6) .embr{display:block}
.emb .crown{inset:auto;top:-22px;left:50%;margin-left:-14px;width:28px;text-align:center;font-size:24px;line-height:1;color:#ffd23a;text-shadow:0 0 10px #ffd23a,0 2px 0 #5a1a00;animation:hover 1.6s ease-in-out infinite;border-radius:0}
.emb.t6 .crown{display:block}
.emb.t6{animation:hue 5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.emn{position:relative;text-align:center;line-height:1}
.emn small{display:block;font-size:10px;color:var(--dim);letter-spacing:.2em}

const KT=`あ:a い:i う:u|wu え:e お:o か:ka|ca き:ki く:ku|cu|qu け:ke こ:ko|co さ:sa し:shi|si|ci す:su せ:se|ce そ:so た:ta ち:chi|ti つ:tsu|tu て:te と:to な:na に:ni ぬ:nu ね:ne の:no は:ha ひ:hi ふ:fu|hu へ:he ほ:ho ま:ma み:mi む:mu め:me も:mo や:ya ゆ:yu よ:yo ら:ra り:ri る:ru れ:re ろ:ro わ:wa を:wo ん:nn が:ga ぎ:gi ぐ:gu げ:ge ご:go ざ:za じ:ji|zi ず:zu ぜ:ze ぞ:zo だ:da ぢ:di づ:du で:de ど:do ば:ba び:bi ぶ:bu べ:be ぼ:bo ぱ:pa ぴ:pi ぷ:pu ぺ:pe ぽ:po ゔ:vu ぁ:xa|la ぃ:xi|li ぅ:xu|lu ぇ:xe|le ぉ:xo|lo ゃ:xya|lya ゅ:xyu|lyu ょ:xyo|lyo っ:xtu|ltu ー:- きゃ:kya きゅ:kyu きょ:kyo しゃ:sha|sya しゅ:shu|syu しょ:sho|syo しぇ:she|sye ちゃ:cha|tya|cya ちゅ:chu|tyu|cyu ちょ:cho|tyo|cyo ちぇ:che|tye にゃ:nya にゅ:nyu にょ:nyo ひゃ:hya ひゅ:hyu ひょ:hyo みゃ:mya みゅ:myu みょ:myo りゃ:rya りゅ:ryu りょ:ryo ぎゃ:gya ぎゅ:gyu ぎょ:gyo じゃ:ja|zya|jya じゅ:ju|zyu|jyu じょ:jo|zyo|jyo じぇ:je|zye びゃ:bya びゅ:byu びょ:byo ぴゃ:pya ぴゅ:pyu ぴょ:pyo ふぁ:fa ふぃ:fi ふぇ:fe ふぉ:fo てぃ:thi でぃ:dhi うぃ:wi うぇ:we`;
const K={};KT.split(/\s+/).forEach(p=>{const [k,v]=p.split(':');K[k]=v.split('|')});
const SMALL='ゃゅょぁぃぅぇぉ';
function tokenize(kana){
  const ch=[...kana],raw=[];
  for(let i=0;i<ch.length;i++){
    const nx=ch[i+1];
    if(nx&&SMALL.includes(nx)&&K[ch[i]]&&ch[i]!=='っ'){
      const two=ch[i]+nx,split=[];
      K[ch[i]].forEach(a=>K[nx].forEach(b=>split.push(a+b)));
      raw.push({k:two,c:[...new Set((K[two]||[]).concat(split))]});i++;continue;
    }
    raw.push({k:ch[i],c:(K[ch[i]]||[ch[i]]).slice()});
  }
  const out=[];
  for(let i=0;i<raw.length;i++){
    const t=raw[i],n=raw[i+1];
    if(t.k==='っ'&&n&&n.k!=='っ'&&n.k!=='ん'){
      const c=[];
      n.c.forEach(x=>{if(!'aiueon-'.includes(x[0])){c.push(x[0]+x);if(x.startsWith('ch'))c.push('t'+x);}});
      ['xtu','ltu','xtsu','ltsu'].forEach(p=>n.c.forEach(x=>c.push(p+x)));
      out.push({k:'っ'+n.k,c:[...new Set(c)]});i++;continue;
    }
    if(t.k==='ん'){
      const c=['nn','xn'];
      if(n&&n.c.every(x=>!'aiueony'.includes(x[0])))c.unshift('n');
      out.push({k:'ん',c});continue;
    }
    out.push(t);
  }
  out.forEach(t=>t.c.sort((a,b)=>a.length-b.length));
  return out;
}

function loop(ts){
  requestAnimationFrame(loop);
  const fdt=Math.min(.1,(ts-(loop.t||ts))/1000);loop.t=ts;drawFx(fdt);
  if(!B)return;
  const dt=Math.min(.1,(ts-(B.lt||ts))/1000);B.lt=ts;
  if(B.active){
    B.tt+=dt;
    B.ws.forEach(e=>{if(e.ct>0)e.ct=Math.max(0,e.ct-dt)});
    const now=performance.now();if(B.buffs.length)B.buffs=B.buffs.filter(b=>b.until>now);
    const en=B.enemy;if(en&&!en.dead){if(en.stun>0)en.stun-=dt;else{en.timer+=dt;if(en.timer>=en.int){en.timer=0;enemyHit()}}}
  }
  if(!B)return;
  if(B.chain&&performance.now()-B.chainT>1200){B.chain=0;B.chainDmg=0;chainDirty=true}
  if(chainDirty)renderChain();
  const en=B.enemy;
  if(en){setW($('ehp'),'ehp',(en.hp/en.max*100).toFixed(1)+'%');setW($('etim'),'etim',(Math.max(0,en.timer)/en.int*100).toFixed(1)+'%');
    const st=en.stun>0;if(UI.stun!==st){UI.stun=st;$('etimerBox').classList.toggle('stun',st)}}
  const p=B.hp/B.maxHp;setW($('php'),'php',(p*100).toFixed(1)+'%');const low=p<.3;if(UI.low!==low){UI.low=low;$('php').classList.toggle('low',low)}
  setW($('psh'),'psh',Math.min(100,B.shield/B.maxHp*100).toFixed(1)+'%');
  setT($('phpTxt'),'phpTxt',`${Math.ceil(B.hp)}/${B.maxHp}`+(B.shield>0?` +${B.shield}`:''));
  B.ws.forEach((e,i)=>{const cool=e.ct>0,v=cool?String(Math.ceil(e.ct)):'';if(e.cs!==cool){e.cs=cool;e.el.classList.toggle('cool',cool)}if(e.cv!==v){e.cv=v;e.el.lastChild.textContent=v}});
  const ab=buffSum('atkbuf'),cb=buffSum('critbuf');
  setH($('buffs'),'buffs',(ab?`<span>攻撃+${Math.round(ab)}%</span>`:'')+(cb?`<span>クリ率+${Math.round(cb)}%</span>`:'')+(en&&en.stun>0?`<span>敵停止 ${en.stun.toFixed(1)}s</span>`:''));
}

async function hashPw(pass,salt){const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:60000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function cloudFlush(){
  if(!CL.ready||!CL.pid||!CL.dirty||CL.writing)return;CL.writing=true;CL.dirty=false;CL.state='saving';renderAcc();
  const pid=CL.pid,js=JSON.stringify(S);
  try{await pref(pid).update({save:js,updated:Date.now(),name:CL.name});CL.state='ok'}
  catch(e){CL.state='err';const c=e&&e.code;
    if(c==='unavailable'){CL.dirty=true;setTimeout(cloudFlush,3000)}
    else if(c==='quota_exceeded')toast('クラウドの保存容量がいっぱいです');
    else if(c==='invalid_argument')toast('クラウドに保存できませんでした（データが大きすぎるか、書き込み権限がありません）');
    else toast('クラウドに保存できませんでした')}

async function syncFromCloud(){

    if(!snap.exists){toast('アカウントが見つからないため、ゲストに戻りました');CL.pid=null;CL.name=null;setSession();const g=readLocal(SAVE_KEY);g?adopt(g):newGame();afterLoadRender();return}
    const v=snap.data(),cd=JSON.parse(v.save||'null'),ld=readLocal(curKey());CL.name=v.name||CL.name;
    if(cd&&(!ld||(cd._t||0)>=(ld._t||0))){adopt(cd);try{localStorage.setItem(curKey(),JSON.stringify(S))}catch(e){}}
    else if(ld&&cd&&(ld._t||0)>(cd._t||0)){CL.dirty=true;cloudFlush()}

async function doLogin(name,pass){
  const qs=await CL.db.collection(`data/users/${CL.uid}`).where('name','==',name).get();
  for(const d of qs.docs){const v=d.data();if(v&&v.salt&&v.hash===await hashPw(pass,v.salt)){
    if(CL.pid){CL.dirty=true;await cloudFlush()}
    CL.pid=d.id.slice(2);CL.name=v.name;const cd=JSON.parse(v.save||'null');cd?adopt(cd):newGame();
    try{localStorage.setItem(curKey(),JSON.stringify(S))}catch(e){}CL.state='ok';setSession();return true}}
  return false;
}
async function doCreate(name,pass,carry){

  await pref(pid).set({name,salt,hash,save:JSON.stringify(S),created:Date.now(),updated:Date.now()});

}

const b64u={enc:u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}};
async function pipeBytes(u8,stream){const r=new Blob([u8]).stream().pipeThrough(stream);return new Uint8Array(await new Response(r).arrayBuffer())}
async function makeCode(){const raw=new TextEncoder().encode(JSON.stringify(S));
  if(window.CompressionStream){try{return 'TD1-'+b64u.enc(await pipeBytes(raw,new CompressionStream('deflate-raw')))}catch(e){}}
  return 'TD0-'+b64u.enc(raw)}
async function readCode(code){code=(code||'').replace(/\s+/g,'');const m=code.match(/^TD([01])-([A-Za-z0-9_-]+)$/);if(!m)throw new Error('format');
  let u8=b64u.dec(m[2]);if(m[1]==='1'){if(!window.DecompressionStream)throw new Error('nodecomp');u8=await pipeBytes(u8,new DecompressionStream('deflate-raw'))}
  const d=JSON.parse(new TextDecoder().decode(u8));if(!d||!Array.isArray(d.inv)||typeof d.exp!=='number')throw new Error('data');return d}

function affSum(w,k){return r1(w.aff.filter(a=>a.k===k).reduce((s,a)=>s+affVal(w,a),0))}
function sortVal(w,k){if(k==='id')return w.id;if(k==='fav')return w.fav?1:0;if(k==='r')return w.r*1000+w.lv;if(k==='lv')return w.lv;if(k==='atk'||k==='hp'||k==='def')return wBase(w)[k];if(k==='sk')return SK[w.sk].n;return affSum(w,k.slice(2))}
function invList(){
  const L=S.inv.filter(w=>(!A.ffav||w.fav)&&A.fr.has(w.r)&&(A.ft<0||w.t===A.ft)&&(!A.fs||w.sk===A.fs)&&(!A.fa||w.aff.some(a=>a.k===A.fa)));
  const k=A.sort,d=A.desc?-1:1;
  return L.sort((a,b)=>{const x=sortVal(a,k),y=sortVal(b,k);const c=typeof x==='string'?x.localeCompare(y,'ja'):x-y;return (c||a.id-b.id)*d});
}
function wStats(w){const b=wBase(w),a={};AFF.forEach(x=>{const v=affSum(w,x.k);if(v)a[x.k]=v});return{atk:b.atk,hp:b.hp,def:b.def,a}}
function paneHTML(w,tag,cmp,extra){
  if(!w)return `<div class="tag">${tag}</div><div class="empty">なし</div>${extra||''}`;
  const R=RAR[w.r],sk=SK[w.sk],s=wStats(w),o=cmp===undefined?null:(cmp?wStats(cmp):{atk:0,hp:0,def:0,a:{}});
  const keys=AFF.map(x=>x.k).filter(k=>s.a[k]||(o&&o.a[k]));
  const row=(n,v,ov,u)=>{u=u||'';let c='',d='';if(o&&v!==ov){c=v>ov?'up':'down';d=` <small>(${v>ov?'+':''}${r1(v-ov)}${u})</small>`}
    return `<span>${n}</span><b class="${c}">${v?v+u:'-'}${d}</b>`};
  return `<div class="tag">${tag}</div><div class="ph" style="--rc:${R.c}"><span class="dem">${wIcon(w)}</span><div style="min-width:0"><div class="dn">${w.fav?'★':''}${w.name}</div><div class="dr">${R.n}　Lv${w.lv}/${R.cap}</div></div></div>
  <div class="pbody"><div><div class="psec">ステータス</div><div class="rows">${row('攻撃',s.atk,o&&o.atk)}${row('HP',s.hp,o&&o.hp)}${row('防御',s.def,o&&o.def)}</div></div>
  <div><div class="psec">追加能力 <small>${w.aff.length}/${R.slots}</small></div>${keys.length?`<div class="rows aff">${keys.map(k=>row(AFFD[k].n,s.a[k]||0,o?(o.a[k]||0):0,'%')).join('')}</div>`:'<div class="small" style="margin-top:4px">なし</div>'}</div></div>
  <div class="psec">スキル</div>
  <div class="psk" style="margin-top:2px"><b>${sk.n}</b>　CT${sk.ct}秒<br>${trText(sk.tr)}：${sk.fx.map(f=>fxText(f,R.sm)).join('、')}</div>${extra||''}`;
}
function simLv(w,g){let lv=w.lv,xp=w.xp+g;const cap=RAR[w.r].cap;while(lv<cap&&xp>=needXP(w,lv)){xp-=needXP(w,lv);lv++}return lv}
function setTab(t){A.tab=t;A.target=null;A.mats.clear();A.synMat=null;A.pick.clear();A.hover=null;
  $('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.tab===t))}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;setTab(b.dataset.tab);renderArmory()};
$('armBack').onclick=()=>show('home');

function renderTop(){
  const open=slotsOpen(rankInfo().r);if(A.slot>=open)A.slot=0;
  $('atitle').textContent={equip:'装備',enh:'強化',syn:'合成'}[A.tab];
  $('aSub').textContent={equip:'クリックでメニュー／長押しか横に引いて枠へドラッグ',enh:'武器を素材にしてレベルを上げる',syn:'同じレア度の武器と追加能力を組み替える'}[A.tab];
  const sl=$('slots');sl.style.display=A.tab==='equip'?'':'none';
  if(A.tab==='equip')sl.innerHTML=SLOT_R.map((v,i)=>{
    if(i>=open)return `<div class="slot lock">🔒<br>ランク${v}</div>`;
    const w=byId(S.eq[i]);
    return `<button class="slot ${w?'f':''} ${A.slot===i?'sel':''}" data-slot="${i}" ${w?`style="--rc:${RAR[w.r].c}"`:''} aria-label="装備枠${i+1}">${w?wIcon(w):'＋'}<span class="sn">${i+1}</span></button>`}).join('');
  let L='',R='',ex='',act='',mr='';
  const hov=byId(A.hover);
  if(A.tab==='equip'){
    const cur=byId(S.eq[A.slot]),right=hov||byId(A.sel);
    L=paneHTML(cur,`装備中（枠${A.slot+1}）`);
    R=right?paneHTML(right,hov?'カーソル中の武器':'選択中の武器',right.id===(cur&&cur.id)?undefined:(cur||null)):'<div class="tag">比較</div><div class="empty">武器にカーソルを合わせるか<br>タップして選択</div>';
    const st=calcStats();ex=`<div class="small">合計　HP ${st.hp}　攻撃 ${st.atk}　防御 ${st.def}　クリ率 ${st.cr}%　クリダメ ${st.cd}%　CT軽減 ${st.ctr}%　スキル威力 ${st.sp}%</div>`;
  }else if(A.tab==='enh'){
    const t=byId(A.target);
    if(t){const mats=[...A.mats].map(byId).filter(Boolean),g=mats.reduce((s,m)=>s+matExp(m),0),sim=simLv(t,g),cap=RAR[t.r].cap;
      L=paneHTML(t,'強化対象',undefined,`<div class="prev">素材${mats.length}個　+${g}EXP　Lv${t.lv} → <b>${sim}</b>${sim>=cap?'（上限）':''}</div>`);
      mr=`<div class="mlab">素材 ${mats.length}個<span class="small">（タップで外す）</span></div><div class="mats">${mats.length?mats.map(w=>`<button class="wc mini" data-mid="${w.id}" style="--rc:${RAR[w.r].c}" title="${w.name}">${wIcon(w)}<span class="lv">Lv${w.lv}</span></button>`).join(''):'<span class="small">下の一覧から素材にする武器をタップ</span>'}</div>`;
      act=`<button class="btn pri" data-a="enh" ${mats.length&&t.lv<cap?'':'disabled'}>強化する</button><button class="btn" data-a="reset">対象を選び直す</button><button class="btn" data-a="bulk0">白を一括選択</button><button class="btn" data-a="bulk1">緑以下を一括選択</button>`;
    }else L='<div class="tag">強化対象</div><div class="empty">下の一覧から武器を選んでください</div>';
    R=hov&&hov.id!==A.target?paneHTML(hov,'カーソル中の武器',undefined,`<div class="prev">素材にすると +${matExp(hov)}EXP</div>`):'<div class="tag">素材</div><div class="empty">'+(t?'素材にする武器をタップ':'—')+'</div>';
  }else{
    const t=byId(A.target),m=byId(A.synMat);
    L=t?paneHTML(t,'ベース'):'<div class="tag">ベース</div><div class="empty">アンコモン以上の武器を選んでください</div>';
    R=m?paneHTML(m,'素材（消費）'):hov&&hov.id!==A.target?paneHTML(hov,'カーソル中の武器'):`<div class="tag">素材</div><div class="empty">${t?`同じレア度（${RAR[t.r].n}）の武器をタップ`:'—'}</div>`;
    if(t)mr=`<div class="mlab">素材${m?'<span class="small">（タップで外す）</span>':''}</div><div class="mats">${m?`<button class="wc mini" data-mid="${m.id}" style="--rc:${RAR[m.r].c}" title="${m.name}">${wIcon(m)}<span class="lv">Lv${m.lv}</span></button>`:`<span class="small">同じレア度（${RAR[t.r].n}）の武器を下の一覧からタップ</span>`}</div>`;
    if(t&&m){const n=RAR[t.r].slots,pool=[...t.aff.map((a,i)=>({key:'b'+i,a,src:'ベース'})),...m.aff.map((a,i)=>({key:'m'+i,a,src:'素材'}))];
      ex=`<div class="mlab">追加能力を${n}つ選択（${A.pick.size}/${n}）</div><div class="daff">${pool.map(p=>`<button class="chip ${A.pick.has(p.key)?'on':''}" data-pick="${p.key}"><small>${p.src}</small>${AFFD[p.a.k].n}+${r1(p.a.v*(1+.015*(t.lv-1)))}%</button>`).join('')}</div>`;
      act=`<button class="btn pri" data-a="syn" ${A.pick.size===n?'':'disabled'}>合成する</button><button class="btn" data-a="reset">ベースを選び直す</button>`;
    }else if(t)act='<button class="btn" data-a="reset">ベースを選び直す</button>';
  }
  $('paneL').innerHTML=L;$('paneR').innerHTML=R;$('extra').innerHTML=ex;$('actions').innerHTML=act;
  const mrw=$('matrow');mrw.innerHTML=mr;mrw.style.display=mr?'':'none';$('actions').classList.toggle('sep',A.tab!=='equip');$('actions').style.display=act?'':'none';
}
function renderInv(){
  const t=byId(A.target),L=invList();
  $('invHead').textContent=`${L.length} / ${S.inv.length}本`;
  $('inv').innerHTML=L.map(w=>{
    let cls='';
    if(A.tab==='equip'&&A.sel===w.id)cls='sel';
    if(A.tab!=='equip'&&A.target===w.id)cls='sel';
    if(A.tab==='syn'&&t&&!A.synMat&&w.id!==t.id&&(w.r!==t.r||isEq(w.id)))cls='dim';
    if(A.tab==='syn'&&!t&&w.r===0)cls='dim';
    if(A.tab==='enh'&&t&&w.id!==t.id&&isEq(w.id))cls='dim';
    const ck=(A.tab==='enh'&&A.mats.has(w.id))||(A.tab==='syn'&&A.synMat===w.id);
    return `<div class="wc ${cls}" data-id="${w.id}" style="--rc:${RAR[w.r].c}" title="${w.name}">${wIcon(w)}<span class="lv">Lv${w.lv}</span>${isEq(w.id)?'<span class="eb">E</span>':''}${w.fav?'<span class="fvb">★</span>':''}${ck?'<span class="ck">✓</span>':''}</div>`}).join('')
    ||'<div class="empty" style="grid-column:1/-1">条件に合う武器がありません</div>';
}
function renderArmory(){renderTop();renderInv()}

function equipTo(id,i){const old=S.eq.indexOf(id);if(old>=0)S.eq[old]=null;S.eq[i]=id;A.slot=i;save();toast(`枠${i+1}に装備しました`)}
function closeCtx(){$('ctx').classList.remove('on')}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#ctx'))closeCtx()},true);
function openCtx(id,x,y){
  const w=byId(id),open=slotsOpen(rankInfo().r),ei=S.eq.indexOf(id),items=[];
  if(ei>=0&&ei<open)items.push([`外す（枠${ei+1}）`,()=>{S.eq[ei]=null;save();toast('外しました')}]);
  else{
    items.push([`枠${A.slot+1}に装備`+(S.eq[A.slot]?'（入れ替え）':''),()=>equipTo(id,A.slot)]);
    const em=S.eq.slice(0,open).indexOf(null);if(em>=0&&em!==A.slot)items.push([`空き枠（枠${em+1}）に装備`,()=>equipTo(id,em)]);
  }
  items.push([w.fav?'☆ お気に入りを解除':'★ お気に入りに登録',()=>{w.fav=!w.fav;save();toast(w.fav?'お気に入りに登録しました':'お気に入りを解除しました')}]);
  items.push(['強化する',()=>{setTab('enh');A.target=id}]);
  if(w.r>0)items.push(['合成のベースにする',()=>{setTab('syn');A.target=id}]);
  if(!isEq(id)&&!w.fav)items.push(['捨てる',()=>{modal(`<h2>捨てる？</h2><p>「${w.name}」（${RAR[w.r].n} Lv${w.lv}）を捨てます。元に戻せません。</p>`,
    [{t:'やめる'},{t:'捨てる',pri:true,fn:()=>{S.inv=S.inv.filter(x=>x.id!==id);if(A.sel===id)A.sel=null;save();toast('捨てました');renderArmory()}}])}]);
  items.push(['閉じる',null]);
  const c=$('ctx');c.innerHTML='';
  items.forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{closeCtx();if(f){f();renderArmory()}};c.appendChild(b)});
  c.style.left='0px';c.style.top='0px';c.classList.add('on');
  const r=c.getBoundingClientRect();c.style.left=Math.max(8,Math.min(x+6,innerWidth-r.width-8))+'px';c.style.top=Math.max(8,Math.min(y+6,innerHeight-r.height-8))+'px';
}
function tapCard(id,x,y){
  if(A.tab==='equip'){A.sel=id;renderArmory();openCtx(id,x,y);return}
  const w=byId(id);if(!w)return;
  if(A.tab==='enh'){
    if(!A.target||id===A.target){A.target=id;A.mats.clear()}
    else if(A.mats.has(id))A.mats.delete(id);
    else if(isEq(id))toast('装備中の武器は素材にできません');
    else if(w.fav)toast('お気に入りの武器は素材にできません（解除すると使えます）');
    else A.mats.add(id);
  }else{
    const t=byId(A.target);
    if(!t){if(w.r===0)toast('コモンには追加能力がないため合成できません');else A.target=id}
    else if(id===t.id)return;
    else if(A.synMat===id){A.synMat=null;A.pick.clear()}
    else if(!A.synMat){
      if(w.r!==t.r)toast('同じレアリティの武器だけ素材にできます');
      else if(isEq(id))toast('装備中の武器は素材にできません');
      else if(w.fav)toast('お気に入りの武器は素材にできません（解除すると使えます）');
      else{A.synMat=id;A.pick=new Set(t.aff.map((_,i)=>'b'+i))}
    }
  }
  renderArmory();
}
$('slots').onclick=e=>{const b=e.target.closest('[data-slot]');if(!b)return;const i=+b.dataset.slot;A.slot=i;renderTop();if(S.eq[i])openCtx(S.eq[i],e.clientX,e.clientY)};
$('matrow').onclick=e=>{const b=e.target.closest('[data-mid]');if(!b)return;const id=+b.dataset.mid;if(A.tab==='enh')A.mats.delete(id);else{A.synMat=null;A.pick.clear()}renderArmory()};
$('extra').onclick=e=>{const b=e.target.closest('[data-pick]');if(!b)return;const k=b.dataset.pick,n=RAR[byId(A.target).r].slots;
  if(A.pick.has(k))A.pick.delete(k);else if(A.pick.size<n)A.pick.add(k);else toast(`選べるのは${n}つまでです`);renderTop()};
$('actions').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==='bulk0'||a==='bulk1'){const mr=a==='bulk0'?0:1;invList().forEach(w=>{if(w.id!==A.target&&!isEq(w.id)&&!w.fav&&w.r<=mr)A.mats.add(w.id)})}
  else if(a==='enh'){
    const t=byId(A.target),mats=[...A.mats].map(byId).filter(Boolean),g=mats.reduce((s,m)=>s+matExp(m),0),from=t.lv,cap=RAR[t.r].cap;
    t.xp+=g;t.tx+=g;while(t.lv<cap&&t.xp>=needXP(t,t.lv)){t.xp-=needXP(t,t.lv);t.lv++}if(t.lv>=cap)t.xp=0;
    S.inv=S.inv.filter(w=>!A.mats.has(w.id));A.mats.clear();save();toast(`強化しました　Lv${from} → ${t.lv}`);
  }else if(a==='reset'){A.target=null;A.mats.clear();A.synMat=null;A.pick.clear()}
  else if(a==='unmat'){A.synMat=null;A.pick.clear()}
  else if(a==='syn'){
    const t=byId(A.target),m=byId(A.synMat);
    t.aff=[...A.pick].map(k=>({...(k[0]==='b'?t.aff:m.aff)[+k.slice(1)]}));
    S.inv=S.inv.filter(w=>w.id!==m.id);A.synMat=null;A.pick.clear();save();toast('合成しました');
  }
  renderArmory();
};

/* hover preview (mouse) */
const IW=$('invwrap');
IW.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse'||P)return;const c=e.target.closest('.wc');const id=c?+c.dataset.id:null;if(id!==A.hover){A.hover=id;renderTop()}});
IW.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!P&&A.hover!=null){A.hover=null;renderTop()}});

/* drag to scroll / long-press drag to equip */
let P=null,ghost=null,inertia=0;
IW.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  cancelAnimationFrame(inertia);
  const card=e.target.closest('.wc');
  P={x:e.clientX,y:e.clientY,st:IW.scrollTop,card,mode:'pend',ly:e.clientY,lt:performance.now(),v:0};
  try{IW.setPointerCapture(e.pointerId)}catch(_){}
  if(card&&A.tab==='equip'){const p=P;P.timer=setTimeout(()=>{if(P===p&&p.mode==='pend')startDrag(p.x,p.y)},320)}
});
IW.addEventListener('pointermove',e=>{
  if(!P)return;const dx=e.clientX-P.x,dy=e.clientY-P.y;
  if(P.mode==='pend'&&Math.hypot(dx,dy)>6){clearTimeout(P.timer);
    if(P.card&&A.tab==='equip'&&Math.abs(dx)>Math.abs(dy)*1.2)startDrag(e.clientX,e.clientY);else P.mode='scroll'}
  if(P.mode==='scroll'){IW.scrollTop=P.st-dy;const now=performance.now(),dt=now-P.lt;if(dt>0){P.v=(e.clientY-P.ly)/dt;P.ly=e.clientY;P.lt=now}}
  else if(P.mode==='drag')moveGhost(e.clientX,e.clientY);
});
function endP(e,cancel){
  if(!P)return;clearTimeout(P.timer);const p=P;P=null;
  if(p.mode==='pend'&&!cancel&&p.card)tapCard(+p.card.dataset.id,e.clientX,e.clientY);
  else if(p.mode==='scroll'&&performance.now()-p.lt<80){let v=-p.v*16;const step=()=>{if(Math.abs(v)<.5)return;IW.scrollTop+=v;v*=.93;inertia=requestAnimationFrame(step)};step()}
  else if(p.mode==='drag')dropGhost(p,e.clientX,e.clientY,cancel);
}
IW.addEventListener('pointerup',e=>endP(e,false));
IW.addEventListener('pointercancel',e=>endP(e,true));
function startDrag(x,y){
  const w=byId(+P.card.dataset.id);if(!w)return;P.mode='drag';P.wid=w.id;
  ghost=document.createElement('div');ghost.className='ghost';ghost.style.setProperty('--rc',RAR[w.r].c);ghost.innerHTML=wIcon(w);document.body.appendChild(ghost);
  P.card.classList.add('lift');A.sel=w.id;A.hover=null;renderTop();moveGhost(x,y);
}
function slotAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('[data-slot]')}
function moveGhost(x,y){if(!ghost)return;ghost.style.left=x+'px';ghost.style.top=y+'px';
  document.querySelectorAll('.slot.drop').forEach(s=>s.classList.remove('drop'));const s=slotAt(x,y);if(s)s.classList.add('drop')}
function dropGhost(p,x,y,cancel){
  const s=cancel?null:slotAt(x,y);if(ghost){ghost.remove();ghost=null}
  if(s)equipTo(p.wid,+s.dataset.slot);renderArmory();
}

$('accBtn').onclick=()=>showAccount();$('xferBtn').onclick=()=>showTransfer();if(!window.claude)$('accBtn').style.display='none';load();renderHome();renderSnd();renderAcc();AU.want='home';

</script>
